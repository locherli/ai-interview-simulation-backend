spring.application.name=ai-interview
server.port=8080

# ---------- PostgreSQL ----------
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_interview
spring.datasource.username=postgres
spring.datasource.password=locher
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------- JPA（表已由 setup.sql 创建，禁止 Hibernate 改表） ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ---------- 应用配置 ----------
# JWT 签名密钥（HS256 要求至少 32 字节），生产环境请通过环境变量 APP_JWT_SECRET 覆盖
app.jwt.secret=ai-interview-dev-secret-key-change-me-in-production-0123456789
app.jwt.expiration-hours=72
# 每场面试：题库抽题数量 + AI 项目追问数量
app.interview.bank-question-count=3
app.interview.project-question-count=2

# ---------- AI 服务（OpenAI 兼容的 Chat Completions 接口） ----------
# 未配置 ai.api-key 时自动使用内置 Mock 评分实现（不调用外部服务）
ai.base-url=https://api.openai.com/v1
ai.api-key=
ai.model=gpt-4o-mini
ai.temperature=0.3
ai.timeout-seconds=60

# ---------- OpenAPI / Swagger UI ----------
# 文档 JSON: /v3/api-docs，UI 页面: /swagger-ui.html（自动跳转 /swagger-ui/index.html）
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.default-produces-media-type=application/json
